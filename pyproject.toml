[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-inspection"
version = "0.1.0"
description = "UR5e AI-driven inspection track (self-contained under inspection/)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",             # cKDTree: seeded object growth in cell/geometry.py
    "pin>=3.0",          # pinocchio + coal: the collision world and FK
    "ompl>=2.0.1",       # tier-2 sampling search (2.0 switched to nanobind)
    "eaik",              # analytic UR5e IK, all branches
    "pyyaml",
    "meshcat",           # 3D verdicts — the primary way we inspect behaviour
    "shapely",           # keep-out footprint union (cell/world.py, display)
    "trimesh",           # extrude the merged footprint into one clean mesh
    "mapbox-earcut",     # trimesh's polygon triangulation engine
]

[tool.setuptools.packages.find]
include = ["inspection*"]

[tool.pytest.ini_options]
markers = [
    "e2e: headless-browser end-to-end tests over a live mock app subprocess (slow; excluded from the default collection by norecursedirs below — run explicitly with `pytest inspection/tests/e2e -m e2e`)",
]
# Keeps `pytest inspection/tests` fast and hardware/browser-free by default.
# Pattern includes pytest's own defaults (docs: "norecursedirs") plus the e2e
# dir; a pattern containing a path separator is matched against the whole
# path, not just the directory's basename, so this excludes it wherever the
# repo is checked out.
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv",
    "{arch}",
    "inspection/tests/e2e",
]

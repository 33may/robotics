# UR5e inspection workcell — declared-geometry model (MAY-183).
#
# Units: meters. pose = [x, y, z, roll, pitch, yaw] (radians), in the PARENT frame.
# Box pose is the CENTER of the box.
#
# Frame tree (why: put each object in the frame it is rigid to; only probe
# transforms that involve the robot):
#   base  — robot base frame. Origin inside the robot's foot. THE frame the
#           solver works in.
#   table — probed ONCE with the robot (welded together, transform is permanent).
#           Convention: origin = front-left corner of the slab TOP surface,
#           x → along front edge to the right, y → away from you across the
#           table, z → up.
#   shelf poses are given in the table frame — tape-measured, re-measure in
#           minutes if furniture moves; no robot needed.

frames:
  table:
    parent: base
    # PROBED 2026-08-18: 5 touch points (4 fit + 1 holdout), calib/probe_fit.py
    # on calib/table_probe_2026-08-18.yaml. Fit RMS 3.1 mm, holdout 5.7 mm.
    # (Session was read with pendant Feature="View"; z corrected to Base by
    # +399.47 mm — see the data file.) Tabletop 5 mm below base origin: the
    # robot stands on a ~5 mm mounting plate on the slab. Axes parallel <0.05deg.
    pose: [-0.1718, -0.7849, -0.0049, -0.00070, 0.00060, 0.00004]

boxes:
  # ---- bounds are modeled as BOXES, not a keep-in volume (Anton, 2026-08-18).
  # The room is open — no side bounds needed. The one real bound: don't dive
  # below table level. Modeled as a wide floor slab just under the table.
  floor:
    parent: base
    dims: [3.00, 3.00, 0.10]
    pose: [0.00, -0.325, -0.11, 0, 0, 0]   # top face at z = -0.06

  # ---- table (from Anton's CAD sketch, 2026-08-17) ----
  # Frame: origin = front-left corner of slab TOP; x right (52.9), y away (100), z up.
  # Sketch "bottom" edge = y=0 (front). All bars 3x3 cm cross-section.
  # Width 52.9 cm TAPE-MEASURED 2026-08-18 (CAD sketch said 53.5).
  table_slab:
    parent: table
    dims: [0.529, 1.00, 0.03]
    pose: [0.2645, 0.50, -0.015, 0, 0, 0]

  bar_bottom:                          # level 2: on the slab, spans BETWEEN the two bottom posts
    parent: table
    dims: [0.449, 0.03, 0.03]          # x 0.05 -> 0.499 (right post inner face)
    pose: [0.2745, 0.015, 0.015, 0, 0, 0]

  post_bottom_left:                    # level 3: 3x3 post, h=100; inset 2 from left
    parent: table
    dims: [0.03, 0.03, 1.00]
    pose: [0.035, 0.015, 0.50, 0, 0, 0]

  post_bottom_right:                   # 0 from right, 0 from bottom
    parent: table
    dims: [0.03, 0.03, 1.00]
    pose: [0.514, 0.015, 0.50, 0, 0, 0]

  post_top_right:                      # 0 from right, 3 cm gap from top edge
    parent: table
    dims: [0.03, 0.03, 1.00]
    pose: [0.514, 0.955, 0.50, 0, 0, 0]

  # ---- shelf: ONE keep-out envelope box (decision: arm never reaches inside) ----
  shelf:
    parent: table
    dims: [0.80, 0.35, 1.80]          # PLACEHOLDER full envelope w×d×h
    pose: [1.60, 0.40, 0.50, 0, 0, 0]  # tape-measured from table corner

# ---- tool: rigid boxes attached to the FLANGE frame (ur_description `flange`:
# +X out of the tool face). The loader welds these to the robot; the validator
# sweeps them with the arm. Envelope philosophy: cover the WORST state.
  # ---- RG2 + camera stack: a CROSS, not a slab (Anton, 2026-08-24) ----
  # The old model was ONE box, 258 x 149 x 170 mm, taking each axis's worst
  # value independently: closed length AND max-open width AND full bracket
  # height. That describes a gripper which never exists, and its four corners
  # are pure phantom volume. Under tilt those corners sweep into the robot's
  # own upper arm: on run 2408-cup1 at a 0.226 m shell it blocked 15 of 36
  # viewsphere cells (`investigation/block_report.py` names the pair).
  #
  # Replaced by three boxes tracing the real silhouette. Measured, not drawn:
  #   * CAD per-part bounds from Antonio's USD (`tool_hull_from_usd.py`).
  #     NOTE the USD's default --slide-mm=-22 is a VISUAL nudge, not physical:
  #     at -22 the open fingers reach 198.1 and cell.yaml's closed estimate is
  #     212; the pendant TCP is 239.9. At slide +6 the open reach is 226.1 and
  #     +13.8 closed lands on 239.9 EXACTLY. So real flange X = USD(-22) + 28,
  #     and that 28 mm IS the mount stack, which the USD does not model.
  #   * bracket height: MEASURED by Anton 2026-08-18 (100 mm below the
  #     centerline, camera top 70 mm above).
  #   * lens at [+142.4, -8.3, -47.5] mm — hand-eye calib 2026-08-19.
  # `investigation/hull_blueprint.py` renders this against the CAD and ASSERTS
  # every one of the 22 parts, the lens and the TCP sit inside the union.
  # Re-run it after ANY edit here. Reachability (2408-cup1): 4->19 cells at
  # r=0.22, 21->28 at r=0.24, 29->31 at r=0.28.
tool:
  rg2_base:
    # The only genuinely tall section: base castings reach Z -40.1..+35.2 but
    # all end by X=36. Carrying that height further forward is what created
    # the phantom corners.
    dims: [0.0580, 0.0900, 0.0790]          # X -18..40, |Y| 45, Z -42..+37
    pose: [0.0110, 0.0, -0.0025, 0, 0, 0]

  rg2_body:
    # Slender body through to the CLOSED fingertip at +240. Width stays at the
    # max-open 149 mm: the fingers really do open that far, and width costs
    # almost no cells (measured: 149->100 mm gains 1).
    dims: [0.2000, 0.1490, 0.0500]          # X 40..240, |Y| 74.5, Z -25..+25
    pose: [0.1400, 0.0, 0.0, 0, 0, 0]

  cam_stack:
    # Camera + brackets: a THIN VERTICAL slab at the lens station, 17 mm to
    # either side. This is the piece that is tall, and it is 34 mm thick — not
    # 258 mm long as the old single box implied.
    dims: [0.0340, 0.0800, 0.1700]          # X 125.4..159.4, |Y| 40, Z -100..+70
    pose: [0.1424, 0.0, -0.0150, 0, 0, 0]

  cable_loop:
    # the classic forgotten sweep — generous slack envelope around the wrist
    dims: [0.10, 0.12, 0.12]          # PLACEHOLDER — eyeball generously
    pose: [-0.05, 0.0, 0.0, 0, 0, 0]  # PLACEHOLDER — behind the flange
